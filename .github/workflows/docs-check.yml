name: docs-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  links:
    name: Markdown 本地死链检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --offline 只校验仓库内的相对链接/文件是否存在，不发起网络请求，
      # 因此不会因外部站点波动而偶发失败。
      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --verbose './**/*.md'
          fail: true

  skills:
    name: Skills frontmatter 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify每个 SKILL.md 都有 name/description
        run: |
          set -euo pipefail
          fail=0
          shopt -s nullglob
          for f in skills/*/SKILL.md; do
            if [ "$(head -n 1 "$f")" != "---" ]; then
              echo "::error file=$f::缺少 YAML frontmatter"
              fail=1
            fi
            grep -q '^name:' "$f" || { echo "::error file=$f::缺少 name 字段"; fail=1; }
            grep -q '^description:' "$f" || { echo "::error file=$f::缺少 description 字段"; fail=1; }
          done
          exit $fail
